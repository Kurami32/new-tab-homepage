<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>New Tab</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="row">
          <label for="homepageSource">New Tab</label>
          <select id="homepageSource">
            <option value="firefox">Firefox homepage</option>
            <option value="custom">Custom URL</option>
          </select>
        </div>
        <div class="row" id="customUrlRow">
          <label for="customUrl">Custom URL</label>
          <input type="text" id="customUrl" placeholder="https://example.com" />
        </div>
        <label class="row toggle">
          <span>Use a different URL in private windows</span>
          <input type="checkbox" id="privateUrlEnabled" role="switch" />
          <span class="track"></span>
        </label>
        <div class="row" id="privateUrlRow">
          <label for="privateUrl">Private window URL</label>
          <input
            type="text"
            id="privateUrl"
            placeholder="https://example.com"
          />
        </div>
        <label class="row toggle">
          <span>Focus the page instead of the address bar</span>
          <input type="checkbox" id="focusPage" role="switch" />
          <span class="track"></span>
        </label>
      </section>
      <h2>Loading</h2>
      <section>
        <div class="row">
          <label for="spinnerColor">Spinner color</label>
          <input type="color" id="spinnerColor" />
        </div>
        <div class="row">
          <label for="backgroundType">Background</label>
          <select id="backgroundType">
            <option value="default">Default</option>
            <option value="color">Custom color</option>
            <option value="image">Image</option>
          </select>
        </div>
        <div class="row" id="backgroundColorRow">
          <label for="backgroundColor">Background color</label>
          <input type="color" id="backgroundColor" />
        </div>
        <div class="row" id="backgroundImageRow">
          <label for="backgroundImage">Background image</label>
          <div class="file">
            <input type="file" id="backgroundImage" accept="image/*" />
            <button type="button" id="clearBackgroundImage">Clear</button>
            <span id="imageStatus"></span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
